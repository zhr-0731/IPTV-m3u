name: Update Radio M3U Files

on:
  schedule:
    - cron: "0 0 */15 * *"   # 每15天的00:00 UTC
  workflow_dispatch:          # 手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Generate M3U files
        run: python generate_m3u.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add radio-global.m3u radio-CN.m3u radio-US.m3u radio-UK.m3u
          git diff --staged --quiet || git commit -m "Auto update radio M3U files [skip ci]" && git push